name: Daily Cache Sync

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-schedule-and-cache:
    name: Smart Cache Check (Daily)
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.cache_check.outputs.skip_all }}
      use_cache: ${{ steps.cache_check.outputs.use_cache }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Smart Cache Check
        id: cache_check
        run: python scripts/smart_cache_check.py --mode daily
      - name: Upload Cached Inputs
        if: steps.cache_check.outputs.use_cache == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cached-inputs
          path: |
            ts_inputs/
            py_inputs/
            upstream_metadata.json
          retention-days: 1

  build:
    name: Build Deduplicated DB
    runs-on: ubuntu-24.04
    needs: [check-schedule-and-cache]
    if: needs.check-schedule-and-cache.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytz
        run: pip install pytz
      - name: Download Cached Inputs
        if: needs.check-schedule-and-cache.outputs.use_cache == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cached-inputs
          path: .
      - name: Run deduplication
        run: |
          mkdir -p ui/data
          SHA=${GITHUB_SHA::7}
          # Daily cache ALWAYS uses cache, so directories are guaranteed
          python scripts/deduplicate.py \
            --ts-input ts_inputs \
            --py-input py_inputs/ \
            --output-dir ui/data \
            --commit-sha "$SHA"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
